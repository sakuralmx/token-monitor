# Token Monitor Hub — HTTP-01 bootstrap (nginx) config for the FIRST certbot run.
# Install to /etc/nginx/sites-available/token-monitor-hub and symlink into
# sites-enabled BEFORE the certificate exists. It serves only the ACME challenge
# webroot on :80 — no TLS block, so `nginx -t` succeeds without a certificate.
#
# After `certbot certonly` issues the IP certificate, replace this file with
# token-monitor-hub.conf (the full HTTPS proxy) and reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name 1.2.3.4;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Not yet live: return a placeholder instead of a redirect loop to a 443
    # block that does not exist yet.
    location / {
        return 503;
    }
}
