# Token Monitor Hub — HTTPS reverse proxy (nginx) template
# Install to /etc/nginx/sites-available/token-monitor-hub and symlink into
# sites-enabled. Replace 1.2.3.4 with the ECS public IP everywhere, including
# the ssl_certificate paths after the first `certbot certonly` run.
#
# Topology: internet :443 → nginx (TLS termination, rate limiting) → 127.0.0.1:17321
# The Node Hub itself never listens on a public interface.

# Rate limiting: 20 req/s burst 40 per client IP. Ingest is authenticated, but
# the unauthenticated /api/health must stay cheap for probing.
limit_req_zone $binary_remote_addr zone=hub:10m rate=20r/s;

# Connection limiting for the long-lived SSE stream. A single authenticated but
# misbehaving client must not be able to pin an unbounded number of nginx/Hub
# sockets (each SSE connection holds a socket + heartbeat timer for its lifetime).
limit_conn_zone $binary_remote_addr zone=hub_stream:10m;

# HTTP-01 challenge traffic must reach certbot's webroot; everything else 301s
# to HTTPS. This server block is what lets `certbot certonly --webroot` renew
# an IP certificate without opening any port besides 80.
server {
    listen 80;
    listen [::]:80;
    server_name 1.2.3.4;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 1.2.3.4;

    # After the first certbot run these resolve under /etc/letsencrypt/live/1.2.3.4/
    ssl_certificate     /etc/letsencrypt/live/1.2.3.4/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1.2.3.4/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Ingest payload ceiling is 1 MiB (see docs/API.md); advertise the same here.
    client_max_body_size 1m;

    location / {
        limit_req zone=hub burst=40 nodelay;
        proxy_pass http://127.0.0.1:17321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SSE stream: no buffering, long timeout, no transform. Without these the
    # widget's live updates stall or the proxy kills the connection. The stream
    # is its own exact-match location, so it needs its own connection limit —
    # the general location's limit_req does not inherit here. 10 concurrent
    # streams per client IP comfortably covers a NAT'd multi-device household
    # while stopping one key-holder from exhausting the connection pool.
    location = /api/stats/stream {
        limit_conn hub_stream 10;
        proxy_pass http://127.0.0.1:17321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }
}
