# Certbot configuration — Token Monitor Hub IP certificate
# Install to /etc/letsencrypt/cli.ini (root-owned, 0644 is fine — no secrets here).

# Use HTTP-01 validation through nginx's /.well-known/acme-challenge/ location.
authenticator = webroot
webroot_path = /var/www/certbot

# Let's Encrypt main endpoint.
server = https://acme-v02.api.letsencrypt.org/directory

# Keep renewal attempts robust: retry 3x with backoff, don't spam.
max-retries = 3

# Prefer IPv4 — some ECS instances have no working IPv6 for ACME.
preferred-chain = "ISRG Root X1"

# Renew 30 days before expiry (LE certs live 90 days).
renew_before_expiry = 30 days
